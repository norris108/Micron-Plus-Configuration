# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Micron Cfg for BigTreeTech OctoPus V1 TMC2209 UART config

## *** THINGS TO CHANGE/CHECK: ***
## MCU paths                            [mcu] section
## Thermistor types                     [extruder] and [heater_bed] sections - See 'sensor types' list at end of file
## Z Endstop Switch location            [safe_z_home] section
## Homing end position                  [gcode_macro G32] section
## Z Endstop Switch  offset for Z0      [stepper_z] section
## Probe points                         [quad_gantry_level] section
## Min & Max gantry corner postions     [quad_gantry_level] section
## PID tune                             [extruder] and [heater_bed] sections
## Thermistor types                     [extruder] and [heater_bed] sections
## Probe pin                            [probe] section
## Fine tune E steps                    [extruder] section


#####################################################################
#   Important other files
#####################################################################

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include shaketune.cfg]
[include nozzle_scrub_adv.cfg]

# [include mmu/base/*.cfg]
# [include mmu/optional/client_macros.cfg]
# [include mmu/addons/dc_espooler.cfg]
# [include mmu/addons/mmu_erec_cutter.cfg]

[exclude_object]

[auto_speed]

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_070036000850535556323420-if00
restart_method: command
##--------------------------------------------------------------------

[printer]
kinematics: corexy
max_velocity: 400  
max_accel: 8820             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

[input_shaper]
shaper_type_x: 2hump_ei     # filter type for the X axis
shaper_freq_x: 89.2    # center frequency for the X axis filter
damping_ratio_x: 0.095 # damping ratio for the X axis
shaper_type_y: mzv     # filter type for the Y axis
shaper_freq_y: 70.0    # center frequency for the Y axis filter
damping_ratio_y: 0.058 # damping ratio for the Y axis

[bed_mesh]
mesh_min: 20,35
mesh_max: 165,175
probe_count: 10,10
algorithm: bicubic
zero_reference_position: 90,90
speed: 300


#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200
##--------------------------------------------------------------------

##  Uncomment below for Micron build
#position_endstop: 115
#position_max: 115

##  Uncomment for Micron+ build
position_min: -5
position_endstop: 174
position_max: 174

##--------------------------------------------------------------------
homing_positive_dir: true
endstop_pin: PG6
homing_retract_dist: 5
homing_speed: 50   #Max 100 

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 32
microsteps: 32
full_steps_per_rotation: 200
position_min: 0
##--------------------------------------------------------------------

##  Uncomment below for Micron build
#position_endstop: 123
#position_max: 123

##  Uncomment for Micron+ build
position_endstop: 190
position_max: 190

##--------------------------------------------------------------------
homing_positive_dir: true
endstop_pin: PG9 
homing_retract_dist: 5
homing_speed: 50   #Max 100 

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

 
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
# endstop_pin: PG10
endstop_pin: probe:z_virtual_endstop  # use beacon as virtual endstop
homing_retract_dist: 0 # beacon needs this to be set to 0
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##  Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
# position_endstop: -0.5
##--------------------------------------------------------------------

##  Uncomment below for Micron build
#position_max: 110

##  Uncomment below for Micron+ build
position_max: 165

##--------------------------------------------------------------------
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.6
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Extruder
#####################################################################

##  Connected to MOTOR_6
##  Heater - HE0
##  Thermistor - T0
[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10              #BMG Gear Ratio
microsteps: 32
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: PA2
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
#sensor_type:
# sensor_pin: PF4
min_temp: 10
max_temp: 320
max_power: 1.0
min_extrude_temp: 170
control: pid
pid_kp: 45.312
pid_ki: 13.731
pid_kd: 37.383
##  Try to keep pressure_advance below 1.0
pressure_advance: 0.04
##  Default is 0.040, leave stock
pressure_advance_smooth_time: 0.040
pwm_cycle_time: 0.02227 # 44.9Hz
# pwm_cycle_time: 0.02088 # 47.9Hz

##  E0 on MOTOR6
[tmc2209 extruder]
uart_pin: PE1
interpolate: false
run_current: 0.3
sense_resistor: 0.110
stealthchop_threshold: 0


#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
##  Heater Pin - BED_OUT - PA1
##  Thermistor - TB - PF3
heater_pin: PA1
##  Validate the following thermistor type to make sure it is correct
##  See https://www.klipper3d.org/Config_Reference.html#common-thermistors for additional options
sensor_type: Generic 3950
sensor_pin: PF3
# pullup_resistor: 5200 # ***** CHECK *****
max_power: 1
min_temp: 0
max_temp: 120
control: pid
pid_kp: 60.937
pid_ki: 3.595
pid_kd: 258.220
pwm_cycle_time: 0.02227 # 44.9Hz
# pwm_cycle_time: 0.02088 # 47.9Hz

#####################################################################
#   Probe
#####################################################################

# [probe]
# ##  Klicky Probe - Since this is just an endstop switch its wired up to one of the endstop ports
# ## For the DIAG_7 port.  Change to !PG15 if probe is NO.
# pin: PG15
# x_offset: 0
# y_offset: 26.0
# z_offset: 0
# speed: 10.0
# samples: 3
# samples_result: median
# sample_retract_dist: 3.0
# samples_tolerance: 0.006
# samples_tolerance_retries: 3

#####################################################################
#   Fan Control
#####################################################################

[fan]
##  Print Cooling Fan - FAN0 - MAKE SURE TO SET THE VOLTAGE JUMPER TO 5V , MOST 3007 FANS ARE 5V
pin: PA8
kick_start_time: 0.5
##  Depending on your fan, you may need to increase this value
##  if your fan will not start. Can change cycle_time (increase)
##  if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
##  Hotend Fan - FAN1
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
##  If you are experiencing back flow, you can reduce fan_speed
#fan_speed: 1.0

[controller_fan controller_fans]
##  Controller fan - FAN2
pin: PD12
heater: heater_bed
fan_speed: 0.5

[multi_pin stepper_drivers_fans]
pins: PD13, PD14

[controller_fan stepper_drivers_fans]
##  Stepper drivers fan 1 - FAN3
pin: multi_pin:stepper_drivers_fans
kick_start_time: 0.5
heater: heater_bed

[fan_generic filter]
pin: PE5
max_power: 1.0
kick_start_time: 0.250
off_below: 0.30

[temperature_fan raspberry_pi]
pin: PD15
control: watermark
max_delta: 3.0
sensor_type: temperature_host
max_temp: 85
min_temp: 0
target_temp: 57.0
max_speed: 1.0
min_speed: 0.3

#####################################################################
#   Miscellaneous
#####################################################################

[firmware_retraction]
# G10 to retract and G11 to unrectract
retract_length: 0.2
unretract_extra_length: 0.1
retract_speed: 40
unretract_speed: 30

[gcode_arcs]
resolution: 0.1

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
[output_pin caselight]
pin: PA2
pwm:true
shutdown_value: 0
value:1
cycle_time: 0.01

## Chamber UV Lighting - HE1 Connector (Optional)
[output_pin blacklight]
pin: PA3
pwm: true
shutdown_value: 0
value: 1
cycle_time: 0.01


#####################################################################
#   TEMPERATURES/THERMISTORS
#####################################################################
[temperature_sensor octopus]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 90

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF4


#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

[quad_gantry_level]

#--------------------------------------------------------------------

##  Gantry Corners for Micron Build
##  Uncomment for Micron build
#gantry_corners:
#   -54.5,-2.15
#   170,180
##  Probe points
#points:
#   5,5
#   5,80
#   110,80
#   110,5

##  Gantry Corners for Micron+ Build
##  Uncomment for Micron+ build
gantry_corners:
  -60.2,-10.4
  244.1,234.5
##  Probe points
points:
  20,2
  20,140
  170,140
  170,2

#--------------------------------------------------------------------

speed: 100
horizontal_move_z: 15
retries: 5
retry_tolerance: 0.0075
max_adjust: 10


#####################################################################
#   TMC Auto-tune
#####################################################################

[autotune_tmc stepper_x]
motor: ldo-35sth52-1504ah
[autotune_tmc stepper_y]
motor: ldo-35sth52-1504ah

[autotune_tmc stepper_z]
